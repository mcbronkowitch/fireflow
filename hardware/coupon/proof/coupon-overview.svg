<text x="132" y="593" font-size="10" fill="#656056">10 mm</text>
<text x="30" y="638" font-size="11.5" fill="#171713">1  the shift registers and the eight LEDs</text>
<text x="30" y="659" font-size="11.5" fill="#171713">2  the Daisy module &#8212; it sits on two sockets</text>
<text x="30" y="680" font-size="11.5" fill="#171713">3  the button and the ADC probe points</text>
<text x="30" y="701" font-size="11.5" fill="#171713">4  Eurorack power in, bulk caps beside it</text>
<text x="396" y="638" font-size="11.5" fill="#171713">5  the 1.0 mm moat &#8212; digital above, analog below</text>
<text x="396" y="659" font-size="11.5" fill="#171713">6  the 3.5 mm audio jack</text>
<text x="396" y="680" font-size="11.5" fill="#171713">7  seven pots, 10 k and 20 k mixed</text>
<text x="396" y="701" font-size="11.5" fill="#171713">8  both mux chips, and most of the small parts</text>
