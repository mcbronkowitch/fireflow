# SRAM-only init-patch audition. The QSPI bank is verified, never programmed.

adapter speed 4000
transport select dapdirect_swd

init
reset halt
load_image $SRAM_ELF

# Direct SRAM entry skips the bootloader's FPU and vector-table setup.
mww 0xE000ED88 0x00F00000
set base 0x24000000
mww 0xE000ED08 $base
set sp [read_memory [expr {$base + 0}] 32 1]
set pc [read_memory [expr {$base + 4}] 32 1]
reg msp $sp
reg pc $pc

# Firmware initializes SDRAM/QSPI, marks WAITING, then executes bkpt 0.
resume
wait_halt 30000
set state [read_memory $STATE_ADDRESS 32 1]
if {$state != 0x41550002} {
    error [format "audition did not reach WAITING (state=%s)" $state]
}

# Fail closed if the installed WAVE bank differs from the linked payload.
verify_image $QSPI_PAYLOAD 0x90040000 bin
load_image $FACTORY_BIN $UPLOAD_ADDRESS bin
mww $STATE_ADDRESS 0x41550003
resume

# Confirm the real engine accepted the sample before detaching.
sleep 2000
halt
set state [read_memory $STATE_ADDRESS 32 1]
if {$state != 0x41550004} {
    error [format "audition did not reach RUNNING (state=%s)" $state]
}
resume
shutdown
