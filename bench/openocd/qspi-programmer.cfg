# Load a tiny SRAM-only helper and its raw payload without touching internal
# flash. HELPER and PAYLOAD are supplied by bench/run.py.

adapter speed 4000
transport select dapdirect_swd

init
reset halt

load_image $HELPER
load_image $PAYLOAD 0x24040000 bin

arm semihosting enable
mww 0xE000ED88 0x00F00000

set base 0x24000000
mww 0xE000ED08 $base
set sp [read_memory [expr {$base + 0}] 32 1]
set pc [read_memory [expr {$base + 4}] 32 1]
reg msp $sp
reg pc $pc

resume
wait_halt 120000
shutdown
